   name: Build credential provider
   on:
     workflow_dispatch:
     push:
       paths:
         - 'Samples/CredentialProvider/**'
   jobs:
     build:
       runs-on: windows-latest
       steps:
         - uses: actions/checkout@v4
           with:
             sparse-checkout: Samples/CredentialProvider
         - uses: microsoft/setup-msbuild@v2
         - name: Build
           run: msbuild Samples/CredentialProvider/CredentialProvider.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
         - uses: actions/upload-artifact@v4
           with:
             name: credprovider-dll
             path: |
               Samples/CredentialProvider/**/*.dll
               Samples/CredentialProvider/**/*.reg
