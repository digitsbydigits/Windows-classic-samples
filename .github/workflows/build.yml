   name: Build credential provider
   on:
     workflow_dispatch:
     push:
       paths:
         - 'Samples/CredentialProvider/**'
   jobs:
     build:
      - name: Build
        shell: pwsh
        run: |
          $slns = Get-ChildItem Samples/CredentialProvider -Recurse -Filter *.sln
          if (-not $slns) {
            Write-Host "No .sln found. Folder contents:"
            Get-ChildItem Samples/CredentialProvider -Recurse | Select-Object -First 50 FullName
            exit 1
          }
          $slns | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          msbuild $slns[0].FullName /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
